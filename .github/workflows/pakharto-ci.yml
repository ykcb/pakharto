# CI khusus ykcb/pakharto (branch main).
# Workflow upstream Quartz (ci.yaml) hanya berjalan untuk repo
# jackyzha0/quartz di branch v5, jadi tidak pernah menguji repo ini.
# Workflow ini menguji pipeline Python wiki: generator llms.txt
# (fail-fast bila halaman CORE hilang), validator skema frontmatter,
# indexer FTS5 (build atomik), dan self-test MCP 12 tools dengan
# assertion nyata.
name: Pakharto CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compile-check Python scripts
        run: >
          python -m py_compile scripts/build_llms_txt.py
          scripts/indexer/build-fts5.py scripts/mcp/wiki_query.py
          scripts/mcp/server.py scripts/validate_frontmatter.py

      - name: Generate llms.txt (fail-fast bila halaman CORE hilang)
        run: python scripts/build_llms_txt.py

      - name: Check llms.txt tanpa tautan kategori mati
        run: |
          if grep -q "pakharto.my.id/kategori/" scripts/assets/llms.txt; then
            echo "ERROR: llms.txt masih menaut ke /kategori/ yang sudah dihapus"
            exit 1
          fi

      - name: Validate frontmatter schema
        run: python scripts/validate_frontmatter.py

      - name: Build FTS5 index
        run: python scripts/indexer/build-fts5.py

      - name: MCP self-test (12 tools)
        run: python scripts/mcp/server.py --test
