name: Auto PR (input & edit)

# Dipicu ketika server /input mendorong branch `input/*` (kiriman materi baru)
# atau `edit/*` (suntingan halaman).
#
# SYARAT: di repo ykcb/pakharto aktifkan
#   Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests"
# Tanpa itu, API menjawab 403 "GitHub Actions is not permitted to create or
# approve pull requests" dan workflow ini gagal — pipeline tetap jalan, hanya PR
# yang harus dibuka manual dari link compare di notifikasi Telegram.

on:
  push:
    branches:
      - "input/**"
      - "edit/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  buat-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Buat Pull Request bila belum ada
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          ADA=$(curl -sS -f \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ykcb/pakharto/pulls?state=open&head=ykcb:$BRANCH" || true)

          if echo "$ADA" | grep -q '"number"'; then
            echo "PR untuk $BRANCH sudah ada — dilewati."
            exit 0
          fi

          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ykcb/pakharto/pulls" \
            -d "{\"title\":\"Kiriman/suntingan tim: $BRANCH\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"Dibuat otomatis dari branch $BRANCH.\n\nPerlu review kurator sebelum merge: periksa diff, pastikan hanya perubahan yang diharapkan (untuk suntingan halaman, frontmatter tidak boleh berubah).\"}"
