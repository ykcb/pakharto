name: Auto PR (input & edit)

on:
  push:
    branches:
      - "input/**"
      - "edit/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  buat-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Buat Pull Request via API
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ykcb/pakharto/pulls" \
            -d "{\"title\":\"Kiriman/suntingan tim: $BRANCH\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"Dibuat otomatis dari branch $BRANCH.\"}"
