name: Auto PR (input & edit)

on:
  push:
    branches:
      - "input/**"
      - "edit/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  buat-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buat Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr create --repo ykcb/pakharto --base main
          --head "${{ github.ref_name }}"
          --title "Kiriman/suntingan tim: ${{ github.ref_name }}"
          --body "Dibuat otomatis dari branch ${{ github.ref_name }}."
