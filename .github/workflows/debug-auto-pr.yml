name: Debug auto-PR

on:
  push:
    branches:
      - "debug/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Panggil API lalu simpan respons
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "repo=$GITHUB_REPOSITORY"
            echo "branch=$BRANCH"
            echo "token_length=${#TOKEN}"
            echo "--- POST /pulls ---"
            curl -sS -w "\nHTTP_STATUS=%{http_code}\n" -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ykcb/pakharto/pulls" \
              -d "{\"title\":\"t\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"b\"}"
            echo "--- GET /repos (token check) ---"
            curl -sS -w "\nHTTP_STATUS=%{http_code}\n" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/ykcb/pakharto"
          } > debug-output.txt 2>&1
          cat debug-output.txt
          git checkout -q -b debug-output
          git add debug-output.txt
          git -c user.email=debug@example.com -c user.name=debug commit -q -m "debug output"
          git push -q origin HEAD:refs/heads/debug-output
